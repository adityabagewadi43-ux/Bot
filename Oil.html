<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oil Market Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            oilblack: "#050505",
            oilgold: "#D4AF37",
            energyorange: "#FF8C00",
            emerald: "#00E676",
            crimson: "#FF3D57",
          },
        },
      },
    };
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-oilblack text-white overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const NAV = ["Dashboard","Markets","Stocks","Charts","News","Screener","Portfolio","Watchlist","Commodities","AI Insights","Learning","Settings"];
    const FILTERS = ["All","Company","Oil Prices","OPEC","Middle East","Economy","Energy"];

    const quotes = [
      { symbol: "WTI", name: "WTI Crude", price: 82.41, change: 1.82, volume: "2.4M", trend: "up" },
      { symbol: "BRENT", name: "Brent Crude", price: 85.73, change: 1.14, volume: "3.1M", trend: "up" },
      { symbol: "NG", name: "Natural Gas", price: 2.91, change: -0.08, volume: "9.8M", trend: "down" },
      { symbol: "HO", name: "Heating Oil", price: 2.72, change: 0.22, volume: "1.9M", trend: "up" },
      { symbol: "RB", name: "Gasoline", price: 2.49, change: -0.05, volume: "2.8M", trend: "down" },
      { symbol: "OPEC", name: "OPEC Basket", price: 84.02, change: 0.97, volume: "N/A", trend: "up" },
    ];

    const stocks = [
      ["XOM","ExxonMobil",118.2,1.8,"18.2M","$462B","3.1%","15.3","7.72",124.8,94.1,"17.9M","Energy","Integrated Oil",18,91,"Buy"],
      ["CVX","Chevron",149.5,1.2,"7.1M","$281B","4.0%","14.8","10.1",171.0,132.5,"6.9M","Energy","Integrated Oil",16,88,"Buy"],
      ["SHEL","Shell",68.4,-0.6,"5.3M","$225B","3.8%","10.9","6.31",74.0,58.9,"5.7M","Energy","Integrated Oil",21,79,"Hold"],
      ["BP","BP",35.9,0.7,"12.4M","$103B","5.9%","8.7","4.12",40.3,29.7,"11.8M","Energy","Integrated Oil",25,74,"Hold"],
      ["TTE","TotalEnergies",68.8,1.1,"3.4M","$164B","4.6%","8.8","7.84",72.6,56.4,"3.1M","Energy","Integrated Oil",19,82,"Buy"],
      ["COP","ConocoPhillips",118.9,-1.4,"6.5M","$143B","2.8%","12.2","8.81",135.6,95.2,"6.1M","Energy","E&P",17,77,"Hold"],
      ["OXY","Occidental",58.6,2.3,"13.2M","$53B","1.1%","17.4","3.48",71.1,47.4,"12.5M","Energy","E&P",28,85,"Buy"],
      ["MRO","Marathon Oil",27.3,-0.9,"9.1M","$16B","1.9%","11.8","2.31",31.7,20.5,"8.8M","Energy","E&P",23,70,"Hold"],
    ].map(([symbol,name,price,daily,volume,marketCap,dividend,pe,eps,high52,low52,avgVol,sector,industry,risk,ai,signal]) => ({
      symbol: String(symbol), name: String(name), price: Number(price), daily: Number(daily), volume: String(volume),
      marketCap: String(marketCap), dividend: String(dividend), pe: Number(pe), eps: Number(eps),
      high52: Number(high52), low52: Number(low52), avgVol: String(avgVol), sector: String(sector),
      industry: String(industry), risk: Number(risk), ai: Number(ai), signal: String(signal)
    }));

    const news = [
      { title: "OPEC signals cautious supply discipline amid rising demand expectations", source: "Reuters", time: "2m ago", impact: 84 },
      { title: "Brent firms as inventory draw boosts sentiment across energy markets", source: "Bloomberg", time: "6m ago", impact: 77 },
      { title: "Refinery margins widen as gasoline crack spreads improve", source: "CNBC", time: "12m ago", impact: 68 },
      { title: "US shale producers maintain capital discipline while cash flows stay strong", source: "Financial Times", time: "19m ago", impact: 73 },
    ];

    function useTicker() {
      const [t, setT] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setT(v => v + 1), 1000);
        return () => clearInterval(id);
      }, []);
      return t;
    }

    function MiniSparkline({ up = true }) {
      const pts = useMemo(() =>
        Array.from({ length: 16 }, (_, i) => {
          const base = up ? 20 + i * 1.5 : 44 - i * 1.3;
          return `${i * 7},${Math.max(6, Math.min(54, base + Math.sin(i * 0.8) * 8))}`;
        }).join(" "),
      [up]);
      return (
        <svg viewBox="0 0 110 60" className="h-10 w-full overflow-visible">
          <polyline points={pts} fill="none" stroke="url(#g)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
          <defs>
            <linearGradient id="g" x1="0" x2="1">
              <stop offset="0%" stopColor={up ? "#00E676" : "#FF3D57"} />
              <stop offset="100%" stopColor="#D4AF37" />
            </linearGradient>
          </defs>
        </svg>
      );
    }

    function GlassCard({ children, className = "" }) {
      return (
        <div className={`rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-[0_0_50px_rgba(212,175,55,0.08)] ${className}`}>
          {children}
        </div>
      );
    }

    function LiveBackground() {
      const ref = useRef(null);
      useEffect(() => {
        const c = ref.current;
        if (!c) return;
        const ctx = c.getContext("2d");
        let raf = 0, t = 0, w = 0, h = 0;

        const resize = () => {
          const dpr = window.devicePixelRatio || 1;
          w = c.clientWidth * dpr;
          h = c.clientHeight * dpr;
          c.width = w;
          c.height = h;
        };

        const draw = () => {
          const dpr = window.devicePixelRatio || 1;
          t += 0.006;
          ctx.clearRect(0, 0, w, h);
          const grad = ctx.createLinearGradient(0, 0, 0, h);
          grad.addColorStop(0, "#050505");
          grad.addColorStop(0.6, "#09090c");
          grad.addColorStop(1, "#030303");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          for (let i = 0; i < 7; i++) {
            ctx.globalAlpha = 0.05;
            ctx.strokeStyle = i % 2 ? "#D4AF37" : "#FF8C00";
            ctx.lineWidth = 2 * dpr;
            ctx.beginPath();
            for (let x = 0; x <= w; x += 20 * dpr) {
              const y = h * 0.72 + Math.sin(x * 0.002 + t * 1.2 + i) * 18 * dpr + Math.sin(x * 0.01 + t * 2 + i) * 6 * dpr;
              x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();
          }

          ctx.globalAlpha = 0.08;
          for (let i = 0; i < 55; i++) {
            const x = (Math.sin(t * 0.9 + i) * 0.5 + 0.5) * w;
            const y = (Math.cos(t * 1.1 + i * 1.7) * 0.5 + 0.5) * h;
            ctx.fillStyle = i % 3 === 0 ? "#00E676" : i % 3 === 1 ? "#D4AF37" : "#FF3D57";
            ctx.beginPath();
            ctx.arc(x, y, (i % 4 + 1) * dpr, 0, Math.PI * 2);
            ctx.fill();
          }

          raf = requestAnimationFrame(draw);
        };

        resize();
        draw();
        window.addEventListener("resize", resize);
        const vis = () => {
          if (document.hidden) cancelAnimationFrame(raf);
          else draw();
        };
        document.addEventListener("visibilitychange", vis);

        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener("resize", resize);
          document.removeEventListener("visibilitychange", vis);
        };
      }, []);
      return <canvas ref={ref} className="absolute inset-0 h-full w-full opacity-[0.55]" />;
    }

    function App() {
      const [dark, setDark] = useState(true);
      const [activeFilter, setActiveFilter] = useState("All");
      useTicker();

      return (
        <div className={`${dark ? "dark" : ""} min-h-screen bg-[#050505] text-white`}>
          <div className="fixed inset-0 overflow-hidden">
            <LiveBackground />
            <div className="absolute inset-0 bg-gradient-to-b from-black/25 via-black/35 to-black/70"></div>
            <div className="absolute inset-0 opacity-40 [background:radial-gradient(circle_at_20%_20%,rgba(212,175,55,0.12),transparent_25%),radial-gradient(circle_at_80%_20%,rgba(0,230,118,0.10),transparent_22%),radial-gradient(circle_at_50%_80%,rgba(255,140,0,0.08),transparent_26%)]"></div>
          </div>

          <div className="relative z-10">
            <header className="sticky top-0 z-50 border-b border-white/10 bg-black/35 backdrop-blur-2xl">
              <div className="mx-auto flex max-w-[1800px] items-center gap-4 px-4 py-3 lg:px-6">
                <div className="flex items-center gap-3">
                  <div className="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-[#D4AF37] via-[#FF8C00] to-[#00E676] text-black shadow-[0_0_30px_rgba(212,175,55,0.35)]">🔥</div>
                  <div>
                    <div className="text-sm font-semibold tracking-[0.3em] text-[#D4AF37]">OIL MARKET PRO</div>
                    <div className="text-[10px] uppercase tracking-[0.3em] text-white/45">Bloomberg x TradingView x Tesla</div>
                  </div>
                </div>
                <div className="hidden flex-1 items-center gap-1 overflow-x-auto lg:flex">
                  {NAV.map((n) => <button key={n} className="rounded-full px-4 py-2 text-sm text-white/75 transition hover:bg-white/8 hover:text-white">{n}</button>)}
                </div>
                <div className="ml-auto flex items-center gap-2">
                  <button className="rounded-full border border-white/10 bg-white/5 p-2.5">🔍</button>
                  <button className="rounded-full border border-white/10 bg-white/5 p-2.5">🔔</button>
                  <button className="rounded-full border border-white/10 bg-white/5 p-2.5" onClick={() => setDark(v => !v)}>{dark ? "🌙" : "☀️"}</button>
                  <button className="rounded-full border border-white/10 bg-white/5 p-2.5">👤</button>
                </div>
              </div>
            </header>

            <main className="mx-auto max-w-[1800px] space-y-6 px-4 py-6 lg:px-6">
              <section className="grid gap-6 xl:grid-cols-[1.5fr_0.9fr]">
                <GlassCard className="relative overflow-hidden p-6 md:p-8">
                  <div className="absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(212,175,55,0.16),transparent_30%),radial-gradient(circle_at_bottom_right,rgba(0,230,118,0.08),transparent_28%)]"></div>
                  <div className="relative">
                    <div className="mb-4 inline-flex items-center gap-2 rounded-full border border-[#D4AF37]/30 bg-[#D4AF37]/10 px-3 py-1 text-xs uppercase tracking-[0.3em] text-[#D4AF37]">Live Energy Intelligence</div>
                    <h1 className="max-w-4xl text-4xl font-semibold leading-tight md:text-6xl">Global Oil Stock Intelligence Platform</h1>
                    <p className="mt-4 max-w-3xl text-sm leading-7 text-white/72 md:text-lg">Analyze every oil company in the world using live charts, financial data, technical indicators, news sentiment and AI-powered predictions.</p>
                    <div className="mt-6 flex flex-wrap gap-3">
                      <button className="rounded-2xl bg-[#D4AF37] px-5 py-3 font-medium text-black">Explore Markets</button>
                      <button className="rounded-2xl border border-white/10 bg-white/5 px-5 py-3 font-medium text-white">Start Investing</button>
                      <button className="rounded-2xl border border-[#00E676]/20 bg-[#00E676]/10 px-5 py-3 font-medium text-[#00E676]">Live Market</button>
                    </div>
                  </div>
                </GlassCard>

                <GlassCard className="relative overflow-hidden p-5">
                  <div className="mb-4 flex items-center justify-between">
                    <div>
                      <div className="text-xs uppercase tracking-[0.28em] text-white/40">Live Market Ticker</div>
                      <div className="text-lg font-semibold text-[#D4AF37]">Streaming Overview</div>
                    </div>
                    <div className="text-[#FF8C00]">⚡</div>
                  </div>
                  <div className="space-y-3">
                    {quotes.map((q) => (
                      <div key={q.symbol} className="rounded-2xl border border-white/8 bg-black/20 p-3">
                        <div className="flex items-center justify-between">
                          <div>
                            <div className="text-sm font-medium">{q.name}</div>
                            <div className="text-xs text-white/45">{q.symbol} · {q.volume}</div>
                          </div>
                          <div className={`flex items-center gap-1 text-sm font-semibold ${q.trend === "up" ? "text-[#00E676]" : q.trend === "down" ? "text-[#FF3D57]" : "text-white/70"}`}>
                            {q.price}
                            <span>{q.change > 0 ? "+" : ""}{q.change}%</span>
                          </div>
                        </div>
                        <div className="mt-2"><MiniSparkline up={q.trend !== "down"} /></div>
                      </div>
                    ))}
                  </div>
                </GlassCard>
              </section>

              <section className="grid gap-4 sm:grid-cols-2 xl:grid-cols-6">
                {quotes.map((q) => (
                  <GlassCard key={q.symbol} className="p-4">
                    <div className="text-xs uppercase tracking-[0.25em] text-white/35">{q.name}</div>
                    <div className="mt-2 text-2xl font-semibold">{q.price}</div>
                    <div className={`mt-1 flex items-center gap-1 text-sm ${q.change >= 0 ? "text-[#00E676]" : "text-[#FF3D57]"}`}>
                      {q.change > 0 ? "+" : ""}{q.change}% today
                    </div>
                    <div className="mt-3"><MiniSparkline up={q.trend !== "down"} /></div>
                  </GlassCard>
                ))}
              </section>

              <section className="grid gap-6 xl:grid-cols-[1.35fr_0.9fr]">
                <GlassCard className="p-5">
                  <div className="flex items-center justify-between gap-3">
                    <div>
                      <div className="text-xs uppercase tracking-[0.3em] text-white/40">Advanced Chart</div>
                      <div className="text-xl font-semibold">TradingView-style Interactive Chart</div>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {["1D","5D","1M","6M","1Y","5Y","MAX"].map((x) => <button key={x} className="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs">{x}</button>)}
                    </div>
                  </div>
                  <div className="mt-4 grid h-[420px] place-items-center rounded-3xl border border-white/10 bg-[linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.01))]">
                    <div className="text-center">
                      <div className="mx-auto text-4xl text-[#D4AF37]">📈</div>
                      <div className="mt-3 text-lg font-semibold">Candlestick, line, area, Heikin Ashi</div>
                      <div className="mt-2 max-w-xl text-sm text-white/55">Integrate TradingView Lightweight Charts here for live OHLC, indicators, drawing tools, and synced technical overlays.</div>
                    </div>
                  </div>
                </GlassCard>

                <div className="space-y-6">
                  <GlassCard className="p-5">
                    <div className="flex items-center justify-between">
                      <div>
                        <div className="text-xs uppercase tracking-[0.3em] text-white/40">Market Status</div>
                        <div className="text-xl font-semibold">Global Sessions</div>
                      </div>
                      <div className="text-[#00E676]">🌍</div>
                    </div>
                    <div className="mt-4 space-y-3">
                      {["US Market","UK Market","India","Europe","Middle East","Asia"].map((m, i) => (
                        <div key={m} className="flex items-center justify-between rounded-2xl border border-white/8 bg-black/20 px-4 py-3">
                          <span>{m}</span>
                          <span className={i % 2 === 0 ? "text-[#00E676]" : "text-[#FF3D57]"}>{i % 2 === 0 ? "Open" : "Closed"}</span>
                        </div>
                      ))}
                    </div>
                  </GlassCard>

                  <GlassCard className="p-5">
                    <div className="text-xs uppercase tracking-[0.3em] text-white/40">AI Insights</div>
                    <div className="mt-2 text-xl font-semibold">Sentiment + Momentum</div>
                    <div className="mt-4 space-y-3">
                      {[
                        ["Bullish", "76% confidence"],
                        ["Prediction", "Price likely to continue higher"],
                        ["Risk Score", "Moderate"],
                        ["Entry", "82.10 - 82.35"],
                        ["Target", "84.60 / 86.25"],
                        ["Stop Loss", "80.90"],
                      ].map(([a,b]) => (
                        <div key={a} className="flex items-center justify-between rounded-2xl border border-white/8 bg-black/20 px-4 py-3">
                          <span className="text-white/70">{a}</span>
                          <span className="text-sm text-[#D4AF37]">{b}</span>
                        </div>
                      ))}
                    </div>
                  </GlassCard>
                </div>
              </section>

              <section className="grid gap-6 xl:grid-cols-[1.2fr_1fr]">
                <GlassCard className="p-5">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <div className="text-xs uppercase tracking-[0.3em] text-white/40">Top Oil Stocks</div>
                      <div className="text-xl font-semibold">Institutional-grade company universe</div>
                    </div>
                    <button className="rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm">Compare Selected</button>
                  </div>
                  <div className="mt-4 grid gap-4 md:grid-cols-2 2xl:grid-cols-3">
                    {stocks.map((s) => (
                      <div key={s.symbol} className="rounded-3xl border border-white/10 bg-white/5 p-4 transition hover:-translate-y-1 hover:border-[#D4AF37]/35 hover:bg-white/7">
                        <div className="flex items-start justify-between gap-3">
                          <div>
                            <div className="text-lg font-semibold">{s.name}</div>
                            <div className="text-xs text-white/45">{s.symbol} · {s.sector}</div>
                          </div>
                          <button className="rounded-full border border-white/10 bg-black/20 p-2">★</button>
                        </div>
                        <div className="mt-3 grid grid-cols-2 gap-2 text-sm">
                          <div className="rounded-2xl bg-black/20 p-2">Price <span className="float-right text-[#D4AF37]">{s.price}</span></div>
                          <div className="rounded-2xl bg-black/20 p-2">Daily <span className={`float-right ${s.daily >= 0 ? "text-[#00E676]" : "text-[#FF3D57]"}`}>{s.daily > 0 ? "+" : ""}{s.daily}%</span></div>
                          <div className="rounded-2xl bg-black/20 p-2">PE <span className="float-right">{s.pe}</span></div>
                          <div className="rounded-2xl bg-black/20 p-2">AI <span className="float-right text-[#00E676]">{s.ai}</span></div>
                        </div>
                        <div className="mt-3"><MiniSparkline up={s.daily >= 0} /></div>
                      </div>
                    ))}
                  </div>
                </GlassCard>

                <div className="space-y-6">
                  <GlassCard className="p-5">
                    <div className="flex items-center justify-between">
                      <div>
                        <div className="text-xs uppercase tracking-[0.3em] text-white/40">Breaking News</div>
                        <div className="text-xl font-semibold">Live energy headlines</div>
                      </div>
                    </div>
                    <div className="mt-4 flex gap-2 overflow-x-auto pb-2">
                      {FILTERS.map((f) => <button key={f} onClick={() => setActiveFilter(f)} className={`whitespace-nowrap rounded-full px-4 py-2 text-sm ${activeFilter===f ? "bg-[#D4AF37] text-black" : "border border-white/10 bg-white/5 text-white/75"}`}>{f}</button>)}
                    </div>
                    <div className="mt-3 space-y-3">
                      {news.map((n) => (
                        <div key={n.title} className="rounded-2xl border border-white/8 bg-black/20 p-4">
                          <div className="flex items-start justify-between gap-4">
                            <div>
                              <div className="font-medium">{n.title}</div>
                              <div className="mt-1 text-xs text-white/45">{n.source} · {n.time}</div>
                            </div>
                            <div className="rounded-full border border-[#00E676]/20 bg-[#00E676]/10 px-2 py-1 text-xs text-[#00E676]">{n.impact}%</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </GlassCard>
                </div>
              </section>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
