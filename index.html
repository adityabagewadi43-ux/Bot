    function useTicker() {
      const [t, setT] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setT(v => v + 1), 1000);
        return () => clearInterval(id);
      }, []);
      return t;
    }

    function MiniSparkline({ up = true }) {
      const pts = useMemo(() => {
        return Array.from({ length: 18 }, (_, i) => {
          const y = up ? 45 - Math.sin(i * 0.55) * 10 - i * 0.6 : 28 + Math.sin(i * 0.55) * 10 + i * 0.45;
          return `${i * 6.2},${Math.max(6, Math.min(54, y))}`;
        }).join(" ");
      }, [up]);
      return <svg viewBox="0 0 110 60" className="h-10 w-full overflow-visible"><polyline points={pts} fill="none" stroke={up ? "#00E676" : "#FF3D57"} strokeWidth="2.7" strokeLinejoin="round" strokeLinecap="round" opacity="0.95" /></svg>;
    }

    function MetricPill({label, value, tone="gold"}) {

        <div className="rounded-2xl border border-white/10 bg-black/20 px-4 py-3">
          <div className="text-[10px] uppercase tracking-[0.28em] text-white/35">{label}</div>
          <div style={{color:c}} className="mt-1 text-lg font-semibold">{value}</div>
        </div>
      );
    }

    function LiveBackground() {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let raf = 0, t = 0, w = 0, h = 0;

        const dpr = () => Math.min(window.devicePixelRatio || 1, 1.8);
        const resize = () => {
          w = canvas.clientWidth * dpr();
          h = canvas.clientHeight * dpr();
          canvas.width = w;
          canvas.height = h;
        };

        const draw = () => {
          t += 0.007;
          ctx.clearRect(0, 0, w, h);

          const bg = ctx.createLinearGradient(0, 0, 0, h);
          bg.addColorStop(0, "#050505");
          bg.addColorStop(.55, "#0b0b10");
          bg.addColorStop(1, "#030303");
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, w, h);

          ctx.fillStyle = "rgba(255,255,255,0.02)";
          ctx.fillRect(0, 0, w, h);

          for (let i = 0; i < 5; i++) {
            ctx.globalAlpha = 0.05;
            ctx.strokeStyle = i % 2 ? "#D4AF37" : "#00E676";
            ctx.lineWidth = 1 * dpr();
            ctx.beginPath();
            for (let x = 0; x < w; x += 34 * dpr()) {
              const y = h * 0.24 + i * 70 * dpr() + Math.sin(x * 0.002 + t * 0.6 + i) * 8 * dpr();
              x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();
          }

          const horizon = h * 0.71;
          const skyline = [0.18,0.22,0.29,0.34,0.41,0.47,0.55,0.62,0.69,0.77,0.84].map(v => w * v);
          skyline.forEach((x, idx) => {
            const base = horizon - (idx % 3) * 14 * dpr() - Math.sin(t + idx) * 8 * dpr();
            ctx.fillStyle = "rgba(255,255,255,0.05)";
            ctx.fillRect(x, base - 50 * dpr(), 7 * dpr(), 50 * dpr());
            ctx.fillStyle = idx % 2 ? "rgba(255,140,0,0.10)" : "rgba(212,175,55,0.10)";
            ctx.fillRect(x - 2 * dpr(), base - 18 * dpr(), 14 * dpr(), 18 * dpr());
            ctx.fillStyle = "rgba(255,255,255,0.05)";
            ctx.fillRect(x + 10 * dpr(), base - 22 * dpr(), 3 * dpr(), 22 * dpr());
          });

          for (let i = 0; i < 24; i++) {
            const x = ((i * 83 + Math.sin(t + i) * 80) % w);
            const y = h * 0.20 + Math.sin(t * 1.6 + i) * 25 * dpr();
            ctx.beginPath();
            ctx.arc(x, y, (12 + (i % 5) * 8) * dpr(), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(180,180,180,${0.015 + (i % 3) * 0.006})`;
            ctx.fill();
          }

          const routes = [[0.12,0.32,0.38,0.24],[0.38,0.24,0.66,0.31],[0.18,0.56,0.52,0.41],[0.58,0.44,0.86,0.22],[0.24,0.73,0.67,0.63],[0.12,0.78,0.9,0.64]];
          routes.forEach(([x1,y1,x2,y2],i) => {
            ctx.beginPath();
            const sx = x1 * w, sy = y1 * h, ex = x2 * w, ey = y2 * h, cx = (sx + ex) / 2, cy = (sy + ey) / 2 - 45 * dpr();
            ctx.moveTo(sx, sy);
            ctx.quadraticCurveTo(cx, cy, ex, ey);
            ctx.strokeStyle = i % 2 ? "rgba(0,230,118,0.30)" : "rgba(212,175,55,0.28)";
            ctx.lineWidth = 1.2 * dpr();
            ctx.stroke();
          });

          ctx.globalAlpha = 0.75;
          for (let i = 0; i < 120; i++) {
            const x = (Math.sin(t * 0.9 + i * 1.3) * 0.5 + 0.5) * w;
            const y = (Math.cos(t * 1.2 + i * 1.7) * 0.5 + 0.5) * h;
            const r = (i % 5 + 1) * 0.9 * dpr();
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = i % 4 === 0 ? "rgba(0,230,118,0.45)" : i % 4 === 1 ? "rgba(212,175,55,0.45)" : i % 4 === 2 ? "rgba(255,140,0,0.40)" : "rgba(255,61,87,0.35)";
            ctx.fill();
          }

          const baseY = h * 0.54;
          for (let i = 0; i < 28; i++) {
            const x = w * 0.10 + i * w * 0.028;
            const hi = baseY - 40 * dpr() - Math.sin(t * 1.2 + i) * 16 * dpr();
            const lo = baseY + 28 * dpr() + Math.cos(t * 1.4 + i) * 12 * dpr();
            const open = baseY + Math.sin(t * 1.7 + i) * 16 * dpr();
            const close = baseY + Math.cos(t * 1.6 + i) * 16 * dpr();
            ctx.strokeStyle = close >= open ? "rgba(0,230,118,0.26)" : "rgba(255,61,87,0.26)";
            ctx.lineWidth = 1.2 * dpr();
            ctx.beginPath();
            ctx.moveTo(x, hi);
            ctx.lineTo(x, lo);
            ctx.stroke();
            ctx.fillStyle = close >= open ? "rgba(0,230,118,0.18)" : "rgba(255,61,87,0.18)";
            ctx.fillRect(x - 2.4 * dpr(), Math.min(open, close), 4.8 * dpr(), Math.max(2 * dpr(), Math.abs(close - open)));
          }

          for (let i = 0; i < 34; i++) {
            const x = (i * 91 + (t * 80)) % w;
            const y = h * 0.78 + Math.sin(t * 1.5 + i) * 18 * dpr();
            ctx.beginPath();
            ctx.ellipse(x, y, 6 * dpr(), 8 * dpr(), Math.sin(t + i), 0, Math.PI * 2);
            const g = ctx.createRadialGradient(x - 2 * dpr(), y - 3 * dpr(), 1, x, y, 8 * dpr());
            g.addColorStop(0, "rgba(255,255,255,0.85)");
            g.addColorStop(.28, "rgba(212,175,55,0.55)");
            g.addColorStop(1, "rgba(0,0,0,0.05)");
            ctx.fillStyle = g;
            ctx.fill();
          }

          if (!document.hidden) raf = requestAnimationFrame(draw);
        };

        const onVis = () => {
          if (document.hidden) cancelAnimationFrame(raf);
          else draw();
        };

        resize();
        draw();
        window.addEventListener("resize", resize);
        document.addEventListener("visibilitychange", onVis);

        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener("resize", resize);
          document.removeEventListener("visibilitychange", onVis);
        };
      }, []);
      return <canvas ref={canvasRef} className="absolute inset-0 h-full w-full opacity-[0.88]" />;
    }

            <p className="mt-4 max-w-3xl text-sm leading-7 text-white/72 md:text-lg">{subtitle}</p>
            <div className="mt-6 flex flex-wrap gap-3">
              <button className="rounded-2xl bg-[#D4AF37] px-5 py-3 font-medium text-black glow">Explore Markets</button>
              <button className="rounded-2xl border border-white/10 bg-white/5 px-5 py-3 font-medium text-white">Start Investing</button>
              <button className="rounded-2xl border border-[#00E676]/20 bg-[#00E676]/10 px-5 py-3 font-medium text-[#00E676]">Live Market</button>
            </div>
            <div className="mt-8 grid gap-4 md:grid-cols-3">
              {[["AI Rating","92/100","+8%"],["Forecast","Bullish","Prob. 76%"],["Risk","Moderate","Sharpe 1.8"]].map(([a,b,c]) => (
                <div key={a} className="glass rounded-3xl p-4">
                  <div className="text-xs uppercase tracking-[0.28em] text-white/40">{a}</div>
                  <div className="mt-2 text-2xl font-semibold">{b}</div>
                  <div className="mt-1 text-sm text-[#D4AF37]">{c}</div>
                </div>
              ))}
            </div>
          </div>
        </GlassCard>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Shell />);
  </script>
</body>
</html>
