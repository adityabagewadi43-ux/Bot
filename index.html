<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trading Portal – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg1: #0b1021;
      --bg2: #111833;
      --accent: #00ffa3;
      --accent2: #00c2ff;
      --text: #e6f1ff;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --error: #ff4d4d;
      --success: #00ffa3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(1200px 800px at 10% 10%, var(--bg2), var(--bg1));
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Animated background canvas */
    #bgCanvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
    }

    /* Overlay grid + glow */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(
          to right,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px
        ),
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px
        );
      background-size: 40px 40px;
      pointer-events: none;
    }

    .overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(60% 60% at 50% 40%, rgba(0, 255, 163, 0.08), transparent 60%);
      pointer-events: none;
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    /* Login card */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 28px 24px 24px;
      backdrop-filter: blur(10px);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 0 40px rgba(0, 255, 163, 0.05);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 260deg,
        rgba(0, 255, 163, 0.15) 300deg,
        transparent 360deg
      );
      animation: rotate 8s linear infinite;
      pointer-events: none;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    .card-inner {
      position: relative;
      z-index: 2;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid;
      place-items: center;
      color: #05141a;
      font-weight: 800;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 163, 0.4);
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
      background: linear-gradient(90deg, #fff, #b9fff0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      outline: none;
      transition: 0.2s ease;
      font-size: 14px;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 255, 163, 0.15);
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #041014;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 10px 30px rgba(0, 255, 163, 0.25);
      margin-top: 6px;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 14px 40px rgba(0, 255, 163, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }

    .error {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }

    .error.show-error {
      color: var(--error);
    }

    .error.show-success {
      color: var(--success);
    }

    .footer-note {
      margin-top: 16px;
      font-size: 11px;
      opacity: 0.55;
      text-align: center;
    }

    /* Ticker tape */
    .tape {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 3;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.6),
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.6)
      );
      padding: 8px 0;
      overflow: hidden;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tape-inner {
      display: flex;
      gap: 40px;
      white-space: nowrap;
      animation: scroll 25s linear infinite;
      padding-left: 40px;
      font-size: 12px;
      opacity: 0.9;
    }

    .tape-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .up { color: #00ffa3; }
    .down { color: #ff4d4d; }

    @keyframes scroll {
      to { transform: translateX(-50%); }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 22px 18px 20px;
      }
      .logo-text {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="overlay"></div>

  <div class="container">
    <div class="login-card">
      <div class="card-inner">
        <div class="logo">
          <div class="logo-icon">T</div>
          <div class="logo-text">TradeNexus</div>
        </div>
        <div class="subtitle">Secure trading dashboard login</div>

        <form id="loginForm">
          <div class="field">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" class="btn">Log In</button>
          <div class="error" id="error"></div>
        </form>

        <div class="footer-note">
         THE EGO OF THE ENTROPIC WORLD SHALL BE CUTDOWN INTO PIECES
        </div>
      </div>
    </div>
  </div>

  <div class="tape">
    <div class="tape-inner" id="tape">
      <!-- JS will clone for infinite scroll -->
    </div>
  </div>

  <script>
    // ---------- Live background (candle + grid effect) ----------
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const candles = [];
    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function initCandles() {
      candles.length = 0;
      const cols = Math.floor(w / 80) + 2;
      for (let i = 0; i < cols; i++) {
        candles.push({
          x: i * 80 + rand(-10, 10),
          w: rand(6, 14),
          baseY: rand(h * 0.3, h * 0.7),
          height: rand(40, 140),
          speed: rand(0.2, 0.6),
          up: Math.random() > 0.5,
          hue: rand(150, 180)
        });
      }
    }
    initCandles();
    window.addEventListener('resize', initCandles);

    function drawCandles() {
      ctx.clearRect(0, 0, w, h);

      // Grid
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      const gridSize = 50;
      for (let x = 0; x < w; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y < h; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      ctx.restore();

      // Candles
      candles.forEach(c => {
        c.baseY += c.up ? -c.speed : c.speed;
        if (c.baseY < h * 0.2 || c.baseY > h * 0.85) c.up = !c.up;

        const top = c.baseY - c.height / 2;
        const bottom = c.baseY + c.height / 2;

        // Wick
        ctx.strokeStyle = `hsl(${c.hue}, 90%, 60%)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(c.x, top - c.height * 0.2);
        ctx.lineTo(c.x, bottom + c.height * 0.2);
        ctx.stroke();

        // Body
        const gradient = ctx.createLinearGradient(c.x - c.w / 2, top, c.x + c.w / 2, bottom);
        gradient.addColorStop(0, `hsla(${c.hue}, 90%, 55%, 0.9)`);
        gradient.addColorStop(1, `hsla(${c.hue}, 90%, 35%, 0.9)`);

        ctx.fillStyle = gradient;
        ctx.fillRect(c.x - c.w / 2, top, c.w, c.height);

        // Glow
        ctx.shadowColor = `hsla(${c.hue}, 90%, 50%, 0.6)`;
        ctx.shadowBlur = 20;
        ctx.fillRect(c.x - c.w / 2, top, c.w, c.height);
        ctx.shadowBlur = 0;
      });
    }

    function animate() {
      drawCandles();
      requestAnimationFrame(animate);
    }
    animate();

    // ---------- Ticker tape data ----------
    const tape = document.getElementById('tape');
    const items = [
      { sym: 'BTC/USD', val: '67,432', change: '+1.24%', up: true },
      { sym: 'ETH/USD', val: '3,512', change: '-0.67%', up: false },
      { sym: 'XAU/USD', val: '2,341', change: '+0.31%', up: true },
      { sym: 'NIFTY 50', val: '22,984', change: '+0.54%', up: true },
      { sym: 'USD/INR', val: '83.42', change: '-0.12%', up: false },
      { sym: 'SOL/USD', val: '148.9', change: '+2.18%', up: true },
      { sym: 'CRUDE OIL', val: '78.64', change: '-0.43%', up: false },
    ];

    function buildTapeRow() {
      const row = document.createElement('div');
      row.className = 'tape-inner';
      const data = [...items, ...items];
      data.forEach(it => {
        const el = document.createElement('div');
        el.className = 'tape-item';
        el.innerHTML = `
          <span style="opacity:0.7">${it.sym}</span>
          <span>${it.val}</span>
          <span class="${it.up ? 'up' : 'down'}">${it.change}</span>
        `;
        row.appendChild(el);
      });
      return row;
    }

    tape.appendChild(buildTapeRow());
    tape.appendChild(buildTapeRow());

    // ---------- Login logic -> redirect to home.html ----------
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const userIn = document.getElementById('username');
    const passIn = document.getElementById('password');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorEl.className = 'error';
      errorEl.textContent = '';

      const u = userIn.value.trim();
      const p = passIn.value;

      if (u === 'adi' && p === '09062007') {
        errorEl.classList.add('show-success');
        errorEl.textContent = 'Login successful – redirecting to dashboard...';
        // Disable form while redirecting
        userIn.disabled = true;
        passIn.disabled = true;
        form.querySelector('.btn').disabled = true;

        setTimeout(() => {
          window.location.href = 'home.html';
        }, 800);
      } else {
        errorEl.classList.add('show-error');
        errorEl.textContent = 'Invalid username or password.';
      }
    });
  </script>
</body>
</html>
